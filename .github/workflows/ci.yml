name: CI for go-users-api

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: postgres://app:ci_test_only@localhost:5432/app_test?sslmode=disable

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Load Go dependencies
        run: |
          go mod download
          go mod tidy --diff

      - name: Check version and run tests
        run: |
          go version
          go test -race -count=1 ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Docker build
        run: docker build -t go-users-api:ci .

permissions:
  contents: read
